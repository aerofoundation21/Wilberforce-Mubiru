<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAFA"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Device Frame (Pixel 9 Pro) -->
  <rect x="10" y="10" width="520" height="1060" rx="48" fill="url(#phoneBorder)" stroke="#555" stroke-width="2"/>
  <rect x="20" y="20" width="500" height="1040" rx="40" fill="url(#screenBg)"/>

  <!-- Status Bar & Punchhole Camera -->
  <circle cx="270" cy="50" r="12" fill="#000"/>
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#222">8:16</text>
  <!-- Status Icons -->
  <path d="M440 45 L450 55 L430 55 Z" fill="#222"/>
  <rect x="460" y="44" width="20" height="12" rx="3" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="462" y="46" width="14" height="8" rx="1.5" fill="#222"/>

  <!-- App Header / Logo -->
  <g transform="translate(270, 190)">
    <!-- Leaf Icon -->
    <path d="M-5 -45 C-5 -45 28 -38 32 -10 C34 12 18 24 -2 24 C-20 24 -30 10 -30 -10 C-30 -25 -15 -40 -5 -45 Z" fill="#10B981"/>
    <path d="M-15 15 Q0 -5 18 -25" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Grin Mates Title -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#1E293B" text-anchor="middle">Grin Mates</text>
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="1">Engage  •  Empower  •  Earn</text>
  </g>

  <!-- Feature List -->
  <g transform="translate(60, 360)">
    <!-- Item 1: Secure Wallet -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="#ECFDF5"/>
      <path d="M12 16 h20 v14 h-20 Z M12 20 h20 M26 24 a2 2 0 1 1 0 4 a2 2 0 0 1 0 -4" stroke="#10B981" stroke-width="2" fill="none"/>
      <text x="60" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Secure Wallet Connection</text>
      <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B">Connect with MetaMask securely</text>
    </g>

    <!-- Item 2: Crypto Payments -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="#ECFDF5"/>
      <rect x="10" y="14" width="24" height="16" rx="2" stroke="#10B981" stroke-width="2" fill="none"/>
      <line x1="10" y1="19" x2="34" y2="19" stroke="#10B981" stroke-width="2"/>
      <text x="60" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Crypto Payments</text>
      <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B">Pay with crypto instantly and securely</text>
    </g>

    <!-- Item 3: Earn Green-Points -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="#ECFDF5"/>
      <polygon points="22,12 25,19 32,20 27,25 29,32 22,28 15,32 17,25 12,20 19,19" fill="#10B981"/>
      <text x="60" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Earn Green-Points</text>
      <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B">Get rewards for every eco-friendly action</text>
    </g>
  </g>

  <!-- Interactive Action Buttons -->
  <g transform="translate(50, 680)">
    <!-- Connect with MetaMask Button -->
    <rect x="0" y="0" width="440" height="60" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <g transform="translate(130, 20)">
      <!-- MetaMask Fox Icon -->
      <polygon points="10,0 2,7 5,16 10,12" fill="#E2761B" stroke="#E2761B"/>
      <polygon points="14,0 22,7 19,16 14,12" fill="#E4751F" stroke="#E4751F"/>
      <polygon points="7,14 12,18 17,14 12,10" fill="#D7C1B3"/>
      <polygon points="10,12 5,16 9,21 10,16" fill="#233447"/>
      <polygon points="14,12 19,16 15,21 14,16" fill="#233447"/>
    </g>
    <text x="240" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Connect with MetaMask</text>

    <!-- Continue without account -->
    <text x="220" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#059669" text-anchor="middle" text-decoration="underline">Continue without an account</text>

    <!-- Install MetaMask Button -->
    <rect x="0" y="140" width="440" height="54" rx="27" fill="none" stroke="#F97316" stroke-width="1.5"/>
    <g transform="translate(170, 160)">
      <path d="M0 0 L0 10 M-4 6 L0 10 L4 6" stroke="#EA580C" stroke-width="2" fill="none"/>
      <line x1="-8" y1="14" x2="8" y2="14" stroke="#EA580C" stroke-width="2"/>
    </g>
    <text x="235" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#EA580C" text-anchor="middle">Install MetaMask</text>

    <!-- Terms -->
    <text x="220" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">By connecting, you agree to our Terms of Service</text>
    <text x="220" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">and Privacy Policy</text>
  </g>

  <!-- Bottom Navigation Bar Indicator Line -->
  <rect x="200" y="1040" width="140" height="4" rx="2" fill="#000" opacity="0.6"/>
</svg>
