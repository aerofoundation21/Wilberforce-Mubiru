<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <filter id="docShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="1000" fill="#0f172a" />

  <!-- Production Specs Header -->
  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#0284c7" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • COMMERCIAL STATIONERY &amp; PREPRESS PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: MADI-STAT-2026</text>
  </g>

  <!-- Document Sheet -->
  <g filter="url(#docShadow)" transform="translate(100, 110)">
    <rect width="600" height="740" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

    <!-- Color Registration Marks (Prepress) -->
    <g transform="translate(15, 15)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <line x1="2" y1="10" x2="18" y2="10" stroke="#0284c7" stroke-width="1.5" />
      <line x1="10" y1="2" x2="10" y2="18" stroke="#0284c7" stroke-width="1.5" />
    </g>
    <g transform="translate(565, 15)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <line x1="2" y1="10" x2="18" y2="10" stroke="#0284c7" stroke-width="1.5" />
      <line x1="10" y1="2" x2="10" y2="18" stroke="#0284c7" stroke-width="1.5" />
    </g>

    <!-- Header Section -->
    <rect x="40" y="40" width="520" height="90" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
    
    <!-- Logo Badge -->
    <g transform="translate(60, 55)">
      <rect width="60" height="60" rx="10" fill="#0284c7" />
      <text x="30" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">M</text>
    </g>
    
    <!-- Company Name & Header Details -->
    <text x="135" y="75" fill="#0369a1" font-family="system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="1">MADISOFT TECHNOLOGIES</text>
    <text x="135" y="95" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Enterprise Software • Network Engineering • Digital Solutions</text>
    <text x="135" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Plot 14 Jinja Road, Commercial Plaza, Kampala, Uganda • support@madisoft.ug</text>

    <!-- Receipt No and Date Header -->
    <g transform="translate(40, 145)">
      <rect width="250" height="35" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="22" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OFFICIAL RECEIPT / VOUCHER</text>

      <rect x="370" y="0" width="150" height="35" rx="4" fill="#fef2f2" stroke="#fecaca" />
      <text x="445" y="22" fill="#dc2626" font-family="Courier, monospace" font-size="13" font-weight="700" text-anchor="middle">NO: MADI-8924</text>
    </g>

    <!-- Customer Info Form Grid -->
    <g transform="translate(40, 195)">
      <rect width="520" height="65" fill="#ffffff" stroke="#e2e8f0" rx="4" />
      <text x="15" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RECEIVED FROM:</text>
      <text x="120" y="25" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Corporate Enterprise Client Uganda Ltd.</text>
      <line x1="15" y1="35" x2="505" y2="35" stroke="#f1f5f9" />
      <text x="15" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PAYMENT FOR:</text>
      <text x="120" y="52" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cloud ERP License &amp; Data Center Support Annual Retainer</text>
    </g>

    <!-- Itemized Table Grid -->
    <g transform="translate(40, 280)">
      <rect width="520" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Table Header -->
      <rect width="520" height="32" fill="#0284c7" />
      <text x="25" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ITEM</text>
      <text x="75" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DESCRIPTION OF SERVICES</text>
      <text x="350" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">QTY</text>
      <text x="440" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AMOUNT (UGX)</text>

      <!-- Row 1 -->
      <text x="30" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">1</text>
      <text x="75" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">Enterprise ERP Core Deployment</text>
      <text x="360" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">1</text>
      <text x="500" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">4,500,000</text>
      <line x1="0" y1="75" x2="520" y2="75" stroke="#f1f5f9" />

      <!-- Row 2 -->
      <text x="30" y="100" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">2</text>
      <text x="75" y="100" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">Dedicated High-Speed Fiber Setup</text>
      <text x="360" y="100" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">2</text>
      <text x="500" y="100" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">1,200,000</text>
      <line x1="0" y1="115" x2="520" y2="115" stroke="#f1f5f9" />

      <!-- Row 3 -->
      <text x="30" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">3</text>
      <text x="75" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">Annual Security Audit &amp; Maintenance</text>
      <text x="360" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">1</text>
      <text x="500" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">850,000</text>
      <line x1="0" y1="160" x2="520" y2="160" stroke="#cbd5e1" stroke-width="1.5" />

      <!-- Total Row -->
      <rect y="160" width="520" height="45" fill="#f8fafc" />
      <text x="310" y="188" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">TOTAL PAID:</text>
      <text x="500" y="188" fill="#0369a1" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="end">UGX 6,550,000</text>
    </g>

    <!-- Official Stamp & Signatures -->
    <g transform="translate(60, 540)">
      <line x1="0" y1="60" x2="160" y2="60" stroke="#94a3b8" stroke-dasharray="3 3" />
      <text x="80" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CLIENT SIGNATURE</text>

      <line x1="300" y1="60" x2="460" y2="60" stroke="#94a3b8" stroke-dasharray="3 3" />
      <text x="380" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AUTHORIZED CASHIER</text>

      <!-- MADISOFT Official Ink Stamp Effect -->
      <g transform="translate(320, -10) rotate(-12)">
        <rect width="130" height="60" rx="8" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 2" opacity="0.85" />
        <text x="65" y="24" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">MADISOFT TECH</text>
        <text x="65" y="40" fill="#dc2626" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">PAID &amp; VERIFIED</text>
        <text x="65" y="52" fill="#2563eb" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">KAMPALA UGANDA</text>
      </g>
    </g>

    <!-- Footer Note -->
    <text x="300" y="700" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Prepress vector layout designed by Rogue Ventures Kampala • 3-ply Carbonless NCR Paper</text>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: RECEIPT &amp; STATIONERY DESIGN FOR MADISOFT</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: MADISOFT Technologies • Technique: Commercial Prepress, Stationery Design &amp; Numbering</text>
    <text x="24" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: High-Resolution Prepress PDF, 3-Ply NCR Carbonized Bond Paper • Corporate Stationery Batch</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
