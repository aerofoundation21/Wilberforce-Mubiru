<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="foamGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="foamShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <!-- Production Specs Header -->
  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#16a34a" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • INDUSTRIAL SCREEN PRINTING PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: APPLE-FOAM-800U</text>
  </g>

  <!-- Mattress & Industrial Merch Mockup -->
  <g filter="url(#foamShadow)" transform="translate(100, 140)">
    <!-- Foam Mattress Cover Panel -->
    <rect width="600" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Quilted Fabric Pattern Grid -->
    <g stroke="#e2e8f0" stroke-width="1.5">
      <line x1="0" y1="70" x2="600" y2="70" />
      <line x1="0" y1="140" x2="600" y2="140" />
      <line x1="0" y1="210" x2="600" y2="210" />
      <line x1="0" y1="280" x2="600" y2="280" />
      <line x1="0" y1="350" x2="600" y2="350" />
      <line x1="100" y1="0" x2="100" y2="420" />
      <line x1="200" y1="0" x2="200" y2="420" />
      <line x1="300" y1="0" x2="300" y2="420" />
      <line x1="400" y1="0" x2="400" y2="420" />
      <line x1="500" y1="0" x2="500" y2="420" />
    </g>

    <!-- Center Screen-Printed Apple Foam Industrial Badge -->
    <g transform="translate(100, 90)">
      <rect width="400" height="240" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4" filter="url(#foamShadow)" />
      
      <!-- Apple Foam Graphic Icon -->
      <circle cx="200" cy="75" r="40" fill="url(#foamGreen)" />
      <path d="M 195 50 C 190 35 210 25 215 40 Z" fill="#ca8a04" />
      <text x="200" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">AF</text>

      <text x="200" y="145" fill="#15803d" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="2" text-anchor="middle">APPLE FOAM</text>
      <text x="200" y="170" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">PREMIUM ORTHOPEDIC MATTRESSES</text>

      <rect x="60" y="185" width="280" height="26" rx="6" fill="#15803d" />
      <text x="200" y="202" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">ROTARY PLASTISOL SCREEN CURED</text>
    </g>
  </g>

  <!-- Worker Boiler Suit Branding Card (Lower Section) -->
  <g filter="url(#foamShadow)" transform="translate(100, 590)">
    <rect width="600" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <g transform="translate(40, 30)">
      <rect width="180" height="180" rx="8" fill="#0f172a" stroke="#16a34a" stroke-width="2" />
      <!-- Worker Suit Emblem -->
      <text x="90" y="60" fill="#16a34a" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">WORKWEAR EMBLEM</text>
      <circle cx="90" cy="100" r="28" fill="url(#foamGreen)" />
      <text x="90" y="108" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">AF</text>
      <text x="90" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INDUSTRIAL DRILL</text>
    </g>

    <g transform="translate(250, 40)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">INDUSTRIAL APPAREL &amp; PACKAGING</text>
      <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Client: Apple Foam Industries Mukono</text>
      <text x="0" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Application: High-elasticity textile plastisol inks</text>
      <text x="0" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Durability: Friction &amp; wash resistant for factory operations</text>

      <rect x="0" y="125" width="280" height="35" rx="6" fill="#15803d" />
      <text x="140" y="147" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">800 WORKWEAR &amp; COVER SETS</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: APPLE FOAM BRANDED MATTRESSES &amp; WORKWEAR</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Apple Foam Industries • Technique: Rotary Screen Printing &amp; Industrial Plastisol Curing</text>
    <text x="24" y="68" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Heavy Drill Cotton, Elasticized Textile Inks • 800 Sets Delivered</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
