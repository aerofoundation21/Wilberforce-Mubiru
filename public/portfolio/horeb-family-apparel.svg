<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="poloNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="apparelShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#3b82f6" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • BESPOKE REUNION APPAREL PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: HOREB-250U</text>
  </g>

  <!-- Clothes Hanger -->
  <g id="hanger" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 400 130 C 400 95 435 80 435 55 C 435 35 418 22 398 22 C 378 22 365 37 368 56" stroke-width="9" />
    <path d="M 400 130 L 190 205 C 175 210 180 220 195 218 L 605 218 C 620 220 625 210 610 205 Z" fill="#334155" />
  </g>

  <!-- Navy Polo Shirt with Ribbed Collar & Placket -->
  <g filter="url(#apparelShadow)">
    <path d="M 310 200 
             C 350 240 450 240 490 200 
             L 630 250 
             L 730 380 
             L 640 450 
             L 590 380 
             L 600 840 
             L 200 840 
             L 210 380 
             L 160 450 
             L 70 380 
             L 170 250 
             Z" 
          fill="url(#poloNavy)" 
          stroke="#1e3a8a" 
          stroke-width="2" />

    <!-- Pique Polo Collar -->
    <path d="M 310 200 L 370 260 L 400 230 L 430 260 L 490 200 Z" fill="#1e40af" stroke="#3b82f6" stroke-width="2" />
    <!-- 3-Button Placket -->
    <rect x="382" y="230" width="36" height="120" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="400" cy="255" r="5" fill="#f8fafc" />
    <circle cx="400" cy="285" r="5" fill="#f8fafc" />
    <circle cx="400" cy="315" r="5" fill="#f8fafc" />

    <!-- Left Chest Horeb Family Crest Emblem (DTF Print) -->
    <g transform="translate(250, 360)">
      <circle cx="60" cy="60" r="50" fill="#0f172a" stroke="#facc15" stroke-width="3" />
      <polygon points="60,25 70,50 95,50 75,65 82,90 60,75 38,90 45,65 25,50 50,50" fill="#facc15" />
      <text x="60" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" letter-spacing="1" text-anchor="middle">HOREB</text>
      <text x="60" y="97" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5" text-anchor="middle">FAMILY REUNION</text>
    </g>

    <!-- Large Commemorative Back Graphic Preview Box -->
    <g transform="translate(420, 420)">
      <rect width="150" height="150" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="75" y="45" fill="#facc15" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">COMMEMORATIVE</text>
      <text x="75" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">HOREB CREST</text>
      <text x="75" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">"UNITED IN FAITH"</text>
      <rect x="25" y="105" width="100" height="24" rx="4" fill="#facc15" />
      <text x="75" y="121" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">KAMPALA 2024</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: HOREB FAMILY CUSTOM COMMEMORATIVE APPAREL</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Horeb Family Community • Technique: Direct-to-Film (DTF) Heat Press &amp; Textile Alignment</text>
    <text x="24" y="68" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Combed Cotton Pique Polo, Ultra-Soft DTF Polymer Film • 250 Custom Pieces</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
