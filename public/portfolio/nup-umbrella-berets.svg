<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="nupRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="beretShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#ef4444" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • POLITICAL CAMPAIGN VECTOR &amp; MERCH PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: NUP-VEC-5000U</text>
  </g>

  <!-- Red Wool Military Beret & Campaign T-Shirt Display -->
  <g filter="url(#beretShadow)" transform="translate(100, 140)">
    <!-- Red Wool Beret Silhouette -->
    <g transform="translate(150, 40)">
      <ellipse cx="150" cy="100" rx="180" ry="70" fill="url(#nupRed)" stroke="#7f1d1d" stroke-width="3" />
      <!-- Beret Fold & Crown -->
      <path d="M 0 100 C 50 140 250 140 300 100" fill="none" stroke="#7f1d1d" stroke-width="3" />
      <!-- Leather Sweatband -->
      <path d="M 20 105 C 80 145 220 145 280 105" fill="none" stroke="#000000" stroke-width="8" />

      <!-- Metallic Umbrella Badge on Front of Beret -->
      <circle cx="150" cy="80" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
      <!-- Umbrella Vector Icon -->
      <path d="M 128 80 C 128 65 172 65 172 80 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
      <line x1="150" y1="65" x2="150" y2="92" stroke="#ffffff" stroke-width="2.5" />
      <path d="M 150 92 C 150 96 145 96 145 92" fill="none" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Campaign T-Shirt with Master Umbrella Vector Print (Lower Section) -->
    <g transform="translate(40, 240)">
      <rect width="520" height="460" rx="16" fill="#18181b" stroke="#334155" stroke-width="2" />
      
      <!-- CorelDRAW Vector Alignment Grid -->
      <g stroke="#27272a" stroke-width="1" stroke-dasharray="3 3">
        <line x1="260" y1="0" x2="260" y2="460" />
        <line x1="0" y1="230" x2="520" y2="230" />
      </g>

      <!-- Giant Official NUP Umbrella Vector Art -->
      <g transform="translate(185, 60)">
        <circle cx="75" cy="75" r="75" fill="#dc2626" />
        <path d="M 20 85 C 20 45 130 45 130 85 Z" fill="#ffffff" />
        <!-- Umbrella Rib Scallops -->
        <path d="M 20 85 C 35 78 50 85 50 85 C 65 78 80 85 80 85 C 95 78 110 85 110 85 C 120 80 130 85 130 85" fill="#ffffff" />
        <line x1="75" y1="45" x2="75" y2="120" stroke="#0f172a" stroke-width="6" />
        <path d="M 75 120 C 75 132 60 132 60 120" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
      </g>

      <text x="260" y="270" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="3" text-anchor="middle">PEOPLE POWER</text>
      <text x="260" y="305" fill="#ef4444" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2" text-anchor="middle">OUR POWER</text>

      <rect x="70" y="335" width="380" height="36" rx="8" fill="#dc2626" />
      <text x="260" y="359" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">NATIONAL UNITY PLATFORM (NUP)</text>

      <text x="260" y="410" fill="#94a3b8" font-family="Courier, monospace" font-size="11" font-weight="700" text-anchor="middle">PRECISION COREL DRAW VECTOR HERALDRY • SCREEN PREPRESS</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: NUP CAMPAIGN ATTIRE &amp; SCREEN-PRINTED BERETS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: National Unity Platform Secretariat • Technique: CorelDRAW Vector Digitization &amp; Rotary Screen Print</text>
    <text x="24" y="68" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Heavy Wool Berets with Metal Insignia, Combed Cotton Tees • 5,000 Units</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
