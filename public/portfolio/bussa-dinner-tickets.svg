<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="ticketGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="ticketShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <!-- Production Specs Header -->
  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#f59e0b" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • HIGH-SECURITY EVENT TICKETING PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: BUSSA-GALA-1200U</text>
  </g>

  <!-- Ticket 1 (Primary Front Pass) -->
  <g filter="url(#ticketShadow)" transform="translate(60, 160)">
    <!-- Ticket Body (Black & Gold Premium) -->
    <rect width="680" height="300" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Top Gold Decorative Stripe -->
    <path d="M 0 14 C 0 6 6 0 14 0 L 666 0 C 674 0 680 6 680 14 L 680 20 L 0 20 Z" fill="url(#ticketGold)" />

    <!-- Perforation Line -->
    <line x1="500" y1="20" x2="500" y2="300" stroke="#71717a" stroke-width="2" stroke-dasharray="6 6" />
    <!-- Perforation Cutout Semi-Circles -->
    <circle cx="500" cy="20" r="14" fill="#0f172a" />
    <circle cx="500" cy="300" r="14" fill="#0f172a" />

    <!-- Main Section (Left 500px) -->
    <g transform="translate(40, 45)">
      <!-- BUSSA Crest Emblem -->
      <circle cx="45" cy="45" r="35" fill="#27272a" stroke="#f59e0b" stroke-width="2.5" />
      <text x="45" y="52" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">BUSSA</text>

      <text x="95" y="40" fill="#facc15" font-family="system-ui, sans-serif" font-size="19" font-weight="900" letter-spacing="1">BUNYORO STUDENTS ASSOCIATION</text>
      <text x="95" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">ANNUAL DINNER &amp; AWARDS GALA</text>
      <text x="95" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">THEME: "CULTURE, INNOVATION &amp; ACADEMIC EXCELLENCE"</text>

      <!-- Event Details Bar -->
      <rect x="0" y="110" width="440" height="60" rx="8" fill="#27272a" stroke="#3f3f46" />
      <text x="20" y="133" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DATE &amp; TIME</text>
      <text x="20" y="152" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SATURDAY, 28TH OCT • 6:00 PM</text>

      <text x="220" y="133" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">VENUE</text>
      <text x="220" y="152" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HOTEL AFRICANA, KAMPALA</text>

      <!-- Serial Number & Security Tag -->
      <text x="0" y="210" fill="#ef4444" font-family="Courier, monospace" font-size="15" font-weight="900">SERIAL NO: BUSSA-2025-0482</text>
      <text x="260" y="210" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="800">TABLE PASS: VIP SECTION A</text>
    </g>

    <!-- Tear-Off Stub (Right 180px) -->
    <g transform="translate(520, 45)">
      <text x="70" y="25" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">GATE STUB</text>
      <text x="70" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BUSSA GALA</text>
      <text x="70" y="70" fill="#ef4444" font-family="Courier, monospace" font-size="13" font-weight="800" text-anchor="middle">#0482</text>
      
      <!-- Barcode Graphic -->
      <g transform="translate(10, 95)">
        <rect width="120" height="60" fill="#ffffff" rx="4" />
        <g fill="#000000">
          <rect x="10" y="8" width="4" height="44" />
          <rect x="18" y="8" width="2" height="44" />
          <rect x="24" y="8" width="5" height="44" />
          <rect x="33" y="8" width="2" height="44" />
          <rect x="39" y="8" width="6" height="44" />
          <rect x="49" y="8" width="3" height="44" />
          <rect x="56" y="8" width="2" height="44" />
          <rect x="62" y="8" width="5" height="44" />
          <rect x="71" y="8" width="2" height="44" />
          <rect x="77" y="8" width="7" height="44" />
          <rect x="88" y="8" width="3" height="44" />
          <rect x="95" y="8" width="2" height="44" />
          <rect x="101" y="8" width="5" height="44" />
        </g>
      </g>
      <text x="70" y="180" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TEAR OFF AT GATE</text>
      <text x="70" y="200" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">UGX 50,000</text>
    </g>
  </g>

  <!-- Ticket 2 (Stacked Behind / Angle) -->
  <g filter="url(#ticketShadow)" transform="translate(60, 510)">
    <rect width="680" height="300" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <path d="M 0 14 C 0 6 6 0 14 0 L 666 0 C 674 0 680 6 680 14 L 680 20 L 0 20 Z" fill="url(#ticketGold)" />

    <line x1="500" y1="20" x2="500" y2="300" stroke="#71717a" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="500" cy="20" r="14" fill="#0f172a" />
    <circle cx="500" cy="300" r="14" fill="#0f172a" />

    <g transform="translate(40, 45)">
      <circle cx="45" cy="45" r="35" fill="#27272a" stroke="#f59e0b" stroke-width="2.5" />
      <text x="45" y="52" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">BUSSA</text>

      <text x="95" y="40" fill="#facc15" font-family="system-ui, sans-serif" font-size="19" font-weight="900" letter-spacing="1">BUNYORO STUDENTS ASSOCIATION</text>
      <text x="95" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">ANNUAL DINNER &amp; AWARDS GALA</text>
      <text x="95" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">THEME: "CULTURE, INNOVATION &amp; ACADEMIC EXCELLENCE"</text>

      <rect x="0" y="110" width="440" height="60" rx="8" fill="#27272a" stroke="#3f3f46" />
      <text x="20" y="133" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DATE &amp; TIME</text>
      <text x="20" y="152" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SATURDAY, 28TH OCT • 6:00 PM</text>

      <text x="220" y="133" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">VENUE</text>
      <text x="220" y="152" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HOTEL AFRICANA, KAMPALA</text>

      <text x="0" y="210" fill="#ef4444" font-family="Courier, monospace" font-size="15" font-weight="900">SERIAL NO: BUSSA-2025-0483</text>
      <text x="260" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">TABLE PASS: REGULAR SECTION B</text>
    </g>

    <g transform="translate(520, 45)">
      <text x="70" y="25" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">GATE STUB</text>
      <text x="70" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BUSSA GALA</text>
      <text x="70" y="70" fill="#ef4444" font-family="Courier, monospace" font-size="13" font-weight="800" text-anchor="middle">#0483</text>
      
      <g transform="translate(10, 95)">
        <rect width="120" height="60" fill="#ffffff" rx="4" />
        <g fill="#000000">
          <rect x="10" y="8" width="3" height="44" />
          <rect x="17" y="8" width="4" height="44" />
          <rect x="25" y="8" width="2" height="44" />
          <rect x="31" y="8" width="5" height="44" />
          <rect x="40" y="8" width="3" height="44" />
          <rect x="47" y="8" width="6" height="44" />
          <rect x="57" y="8" width="2" height="44" />
          <rect x="63" y="8" width="5" height="44" />
          <rect x="72" y="8" width="3" height="44" />
          <rect x="79" y="8" width="4" height="44" />
          <rect x="87" y="8" width="2" height="44" />
          <rect x="93" y="8" width="6" height="44" />
          <rect x="103" y="8" width="3" height="44" />
        </g>
      </g>
      <text x="70" y="180" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TEAR OFF AT GATE</text>
      <text x="70" y="200" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">UGX 35,000</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: BUSSA DINNER GALA TICKETS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Bunyoro Students Association • Technique: Numbered Ticket Print, Perforation &amp; Gold Foil Prepress</text>
    <text x="24" y="68" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: 300 GSM Coated Artboard, Anti-Counterfeit Barcode &amp; Perforated Stubs • 1,200 Passes</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
