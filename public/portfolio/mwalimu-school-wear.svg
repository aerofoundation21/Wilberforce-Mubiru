<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="singletCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="singletShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#0284c7" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • ATHLETIC TRACK SINGLET PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: MWALIMU-650U</text>
  </g>

  <!-- Clothes Hanger -->
  <g id="hanger" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 400 130 C 400 95 435 80 435 55 C 435 35 418 22 398 22 C 378 22 365 37 368 56" stroke-width="9" />
    <path d="M 400 130 L 190 205 C 175 210 180 220 195 218 L 605 218 C 620 220 625 210 610 205 Z" fill="#334155" />
  </g>

  <!-- Sleeveless Track Singlet -->
  <g filter="url(#singletShadow)">
    <path d="M 310 200 
             C 360 250 440 250 490 200 
             L 540 200 
             C 520 320 540 400 580 430 
             L 560 840 
             L 240 840 
             L 220 430 
             C 260 400 280 320 260 200 
             Z" 
          fill="url(#singletCyan)" 
          stroke="#075985" 
          stroke-width="2" />

    <!-- White Ribbed Deep Cut Trim -->
    <path d="M 310 200 C 360 250 440 250 490 200" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <!-- Armhole Trims -->
    <path d="M 540 200 C 520 320 540 400 580 430" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M 260 200 C 280 320 260 400 220 430" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Mwalimu Junior School Screen Print Graphics -->
    <g transform="translate(300, 310)">
      <circle cx="100" cy="50" r="36" fill="#ffffff" stroke="#facc15" stroke-width="3" />
      <text x="100" y="46" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">MWALIMU</text>
      <text x="100" y="62" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">JUNIOR</text>

      <text x="100" y="125" fill="#facc15" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2" text-anchor="middle">TRACK &amp; FIELD</text>
      
      <!-- Big Screen-Printed Child Athlete Number -->
      <text x="100" y="270" fill="#ffffff" font-family="system-ui, sans-serif" font-size="130" font-weight="900" text-anchor="middle">12</text>
      <text x="100" y="320" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="3" text-anchor="middle">SPORTS DAY 2023</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: MWALIMU JUNIOR SCHOOL ATHLETIC WEAR</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Mwalimu Junior School Kigo • Technique: Child-Safe Non-Toxic Plastisol Carousel Screen Printing</text>
    <text x="24" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: 130 GSM Micro-Mesh Moisture-Wicking Polyester • 650 Student Kits</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
