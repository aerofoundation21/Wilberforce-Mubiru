<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="capBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="capShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#facc15" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • INSTITUTIONAL HEADWEAR PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: GOU-CAPS-800U</text>
  </g>

  <!-- 5-Panel Baseball Cap Illustration -->
  <g filter="url(#capShadow)" transform="translate(100, 160)">
    <!-- Cap Crown (Side & Front Profile) -->
    <path d="M 120 400 
             C 120 220 220 120 380 120 
             C 540 120 620 250 620 400 
             Z" 
          fill="url(#capBlack)" 
          stroke="#3f3f46" 
          stroke-width="3" />

    <!-- 5-Panel Seams -->
    <path d="M 380 120 L 380 400" stroke="#52525b" stroke-width="2" />
    <path d="M 380 120 C 300 200 240 280 200 400" stroke="#52525b" stroke-width="2" />
    <path d="M 380 120 C 460 200 520 280 560 400" stroke="#52525b" stroke-width="2" />

    <!-- Top Squatcho Button -->
    <circle cx="380" cy="120" r="14" fill="#3f3f46" stroke="#18181b" stroke-width="2" />

    <!-- Ventilation Eyelets -->
    <circle cx="280" cy="220" r="6" fill="#18181b" stroke="#71717a" stroke-width="2" />
    <circle cx="480" cy="220" r="6" fill="#18181b" stroke="#71717a" stroke-width="2" />

    <!-- Cap Visor / Bill -->
    <path d="M 100 400 
             C 100 480 250 560 380 560 
             C 510 560 640 480 640 400 
             C 520 420 240 420 100 400 
             Z" 
          fill="#18181b" 
          stroke="#3f3f46" 
          stroke-width="3" />

    <!-- Visor Stitching Lines -->
    <path d="M 130 420 C 180 480 280 530 380 530 C 480 530 580 480 610 420" fill="none" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 160 435 C 200 480 290 510 380 510 C 470 510 550 480 580 435" fill="none" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Front Crown Embroidered & Heat-Welded Uganda Crest Badge -->
    <g transform="translate(300, 220)">
      <rect width="160" height="150" rx="12" fill="#09090b" stroke="#facc15" stroke-width="3" filter="url(#capShadow)" />
      
      <!-- Uganda Crest Silhouette -->
      <polygon points="80,20 140,50 140,100 80,130 20,100 20,50" fill="#18181b" stroke="#facc15" stroke-width="2" />
      <!-- Crest Stripes (Black, Yellow, Red) -->
      <line x1="35" y1="65" x2="125" y2="65" stroke="#000000" stroke-width="5" />
      <line x1="30" y1="75" x2="130" y2="75" stroke="#facc15" stroke-width="5" />
      <line x1="35" y1="85" x2="125" y2="85" stroke="#dc2626" stroke-width="5" />

      <!-- Crest Bird / Sun Graphic -->
      <circle cx="80" cy="50" r="10" fill="#facc15" />
      <text x="80" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="900" letter-spacing="1" text-anchor="middle">UGANDA</text>
    </g>

    <!-- Side Visor Delegation Tag -->
    <g transform="translate(240, 580)">
      <rect width="280" height="40" rx="8" fill="#18181b" stroke="#facc15" stroke-width="2" />
      <text x="140" y="25" fill="#facc15" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="1" text-anchor="middle">OFFICIAL OUTREACH DELEGATION</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: GOVERNMENT OF UGANDA BRANDED HEADWEAR &amp; CAPS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Government Outreach Delegation • Technique: Pneumatic Cap Heat Press &amp; High-Density Thermal Welds</text>
    <text x="24" y="68" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Heavy Brushed Cotton Twill, Micro-Textured Badging • 800 Field Caps</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
