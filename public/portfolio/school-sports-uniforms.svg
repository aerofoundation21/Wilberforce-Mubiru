<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="jerseyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="jerseyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#eab308" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • INSTITUTIONAL SPORTS DAY KIT PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: SCH-UNIF-2000U</text>
  </g>

  <!-- Clothes Hanger -->
  <g id="hanger" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 400 130 C 400 95 435 80 435 55 C 435 35 418 22 398 22 C 378 22 365 37 368 56" stroke-width="9" />
    <path d="M 400 130 L 190 205 C 175 210 180 220 195 218 L 605 218 C 620 220 625 210 610 205 Z" fill="#334155" />
  </g>

  <!-- Athletic Jersey Body (House Yellow & Emerald Green) -->
  <g filter="url(#jerseyShadow)">
    <path d="M 310 200 
             C 350 240 450 240 490 200 
             L 630 250 
             L 730 380 
             L 640 450 
             L 590 380 
             L 600 840 
             L 200 840 
             L 210 380 
             L 160 450 
             L 70 380 
             L 170 250 
             Z" 
          fill="url(#jerseyGold)" 
          stroke="#854d0e" 
          stroke-width="2" />

    <!-- Green Contrast Side Panels -->
    <path d="M 170 250 L 210 380 L 200 840 L 240 840 L 250 380 L 210 270 Z" fill="#065f46" />
    <path d="M 630 250 L 590 380 L 600 840 L 560 840 L 550 380 L 590 270 Z" fill="#065f46" />

    <!-- V-Neck Collar -->
    <path d="M 310 200 L 400 280 L 490 200" fill="none" stroke="#065f46" stroke-width="12" stroke-linecap="round" />

    <!-- School Crest & House Numbering Screen Print -->
    <g transform="translate(300, 320)">
      <!-- School House Crest -->
      <circle cx="100" cy="50" r="38" fill="#065f46" stroke="#ffffff" stroke-width="3" />
      <text x="100" y="45" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">HOUSE OF</text>
      <text x="100" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">LIONS</text>

      <text x="100" y="125" fill="#065f46" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2" text-anchor="middle">ATHLETICS</text>
      
      <!-- Big Screen-Printed Player Number -->
      <text x="100" y="270" fill="#065f46" font-family="system-ui, sans-serif" font-size="140" font-weight="900" text-anchor="middle">07</text>
      <text x="100" y="320" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="3" text-anchor="middle">PE &amp; SPORTS DEPT</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: SCHOOL UNIFORMS &amp; SPORTS KIT SCREEN PRINTING</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Ugandan Academic Institutions • Technique: Rotary Carousel Textile Printing &amp; Flash Curing</text>
    <text x="24" y="68" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Interlock Breathable Polyester, Sweat-Resistant Screen Inks • 2,000 School Kits</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
