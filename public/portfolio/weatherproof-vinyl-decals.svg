<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="decalChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="decalShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#38bdf8" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • PRECISION CONTOUR VINYL PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: VINYL-1200U</text>
  </g>

  <!-- Vinyl Sticker Sheet Display -->
  <g filter="url(#decalShadow)" transform="translate(80, 140)">
    <!-- Backing Carrier Sheet (Grid cutting mat) -->
    <rect width="640" height="700" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Plotter Cutting Grid -->
    <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4">
      <line x1="0" y1="100" x2="640" y2="100" />
      <line x1="0" y1="200" x2="640" y2="200" />
      <line x1="0" y1="300" x2="640" y2="300" />
      <line x1="0" y1="400" x2="640" y2="400" />
      <line x1="0" y1="500" x2="640" y2="500" />
      <line x1="0" y1="600" x2="640" y2="600" />
      <line x1="100" y1="0" x2="100" y2="700" />
      <line x1="200" y1="0" x2="200" y2="700" />
      <line x1="300" y1="0" x2="300" y2="700" />
      <line x1="400" y1="0" x2="400" y2="700" />
      <line x1="500" y1="0" x2="500" y2="700" />
      <line x1="600" y1="0" x2="600" y2="700" />
    </g>

    <!-- Decal 1: Commercial Fleet Shield (Die-Cut) -->
    <g transform="translate(60, 50)">
      <!-- Peel-away Corner Effect -->
      <path d="M 0 30 C 0 10 10 0 30 0 L 220 0 C 240 0 250 10 250 30 L 250 200 C 250 270 125 320 125 320 C 125 320 0 270 0 200 Z" fill="url(#decalChrome)" stroke="#ffffff" stroke-width="4" />
      <path d="M 0 30 L 250 30" stroke="#ffffff" stroke-width="2" />
      <circle cx="125" cy="110" r="45" fill="#ffffff" />
      <text x="125" y="122" fill="#0369a1" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">RV</text>
      <text x="125" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" text-anchor="middle">FLEET SERVICE</text>
      <text x="125" y="225" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">24/7 HEAVY HAUL</text>
      <text x="125" y="260" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="900" letter-spacing="1" text-anchor="middle">UV WEATHERPROOF CAST VINYL</text>
    </g>

    <!-- Decal 2: Heavy Equipment Warning Decal -->
    <g transform="translate(340, 50)">
      <rect width="240" height="150" rx="8" fill="#facc15" stroke="#000000" stroke-width="4" />
      <rect x="10" y="10" width="220" height="35" rx="4" fill="#000000" />
      <text x="120" y="34" fill="#facc15" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2" text-anchor="middle">WARNING</text>
      <text x="120" y="80" fill="#000000" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">HIGH VOLTAGE FIELD</text>
      <text x="120" y="102" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AUTHORIZED ACCESS ONLY</text>
      <text x="120" y="130" fill="#78350f" font-family="Courier, monospace" font-size="10" font-weight="700" text-anchor="middle">CONTOUR PLOTTER CUT</text>
    </g>

    <!-- Decal 3: Hexagonal Outdoor Equipment Badge -->
    <g transform="translate(340, 230)">
      <polygon points="120,0 240,45 240,165 120,210 0,165 0,45" fill="#0f172a" stroke="#22c55e" stroke-width="4" />
      <circle cx="120" cy="85" r="32" fill="#22c55e" />
      <text x="120" y="94" fill="#0f172a" font-family="system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">ECO</text>
      <text x="120" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">CERTIFIED LOGISTICS</text>
      <text x="120" y="170" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">KAMPALA • 2024</text>
    </g>

    <!-- Decal 4: Long Bumper & Vehicle Fleet Stripe -->
    <g transform="translate(60, 480)">
      <rect width="520" height="80" rx="8" fill="#dc2626" stroke="#ffffff" stroke-width="3" />
      <text x="260" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2" text-anchor="middle">ROGUE HEAVY LOGISTICS</text>
      <text x="260" y="65" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">SAFETY INSPECTED • OFFICIAL FLEET CARRIER</text>
    </g>

    <!-- Decal 5: Circular Inspection Sticker -->
    <g transform="translate(180, 580)">
      <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#0284c7" stroke-width="4" />
      <text x="50" y="42" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">INSPECTED</text>
      <text x="50" y="62" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">2024</text>
    </g>

    <!-- Decal 6: Barcode Fleet Inventory -->
    <g transform="translate(320, 585)">
      <rect width="200" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
      <text x="100" y="25" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SECURITY QR ASSET #772</text>
      <rect x="25" y="35" width="150" height="30" fill="#000000" />
      <text x="100" y="55" fill="#ffffff" font-family="Courier, monospace" font-size="10" font-weight="700" text-anchor="middle">||| | |||| | ||| ||</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: OUTDOOR WEATHERPROOF VINYL DECALS &amp; VEHICLE GRAPHICS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Rogue Commercial Fleet Clients • Technique: Digital Plotter Contour Cutting &amp; UV Lamination</text>
    <text x="24" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Cast Vinyl Film with Permanent Acrylic Adhesive, Gloss UV Laminate • 1,200 Decals</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
