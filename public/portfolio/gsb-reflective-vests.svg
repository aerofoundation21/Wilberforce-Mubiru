<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Studio Lighting & Gradients -->
    <linearGradient id="neonVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddf700" />
      <stop offset="40%" stop-color="#ccf000" />
      <stop offset="100%" stop-color="#b0d600" />
    </linearGradient>
    <linearGradient id="reflective3M" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="gsbRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="vestShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="1000" fill="#0f172a" />
  <circle cx="400" cy="400" r="360" fill="#1e293b" opacity="0.4" filter="blur(40px)" />

  <!-- Production Specs Header Badge -->
  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#22c55e" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • PRODUCTION SPECIFICATION PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: GSB-REF-2023-450U</text>
  </g>

  <!-- Heavy Duty Clothes Hanger -->
  <g id="hanger" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 400 130 C 400 95 435 80 435 55 C 435 35 418 22 398 22 C 378 22 365 37 368 56" stroke-width="9" />
    <path d="M 400 130 L 190 205 C 175 210 180 220 195 218 L 605 218 C 620 220 625 210 610 205 Z" fill="#334155" />
  </g>

  <!-- High-Vis Safety Vest Silhouette -->
  <g filter="url(#vestShadow)">
    <!-- Main Neon Lime Vest Body -->
    <path d="M 270 195 
             L 340 215 
             C 380 235 420 235 460 215 
             L 530 195 
             L 630 255 
             L 590 440 
             L 550 435 
             L 565 840 
             L 235 840 
             L 250 435 
             L 210 440 
             L 170 255 
             Z" 
          fill="url(#neonVest)" 
          stroke="#0f172a" 
          stroke-width="3" />

    <!-- Dark Navy Contrast Trim Borders -->
    <path d="M 270 195 L 340 215 C 380 235 420 235 460 215 L 530 195" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <!-- V-Neck Inner Placket -->
    <path d="M 340 215 L 400 370 L 460 215" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    <!-- Center Zipper Strip -->
    <line x1="400" y1="370" x2="400" y2="840" stroke="#0f172a" stroke-width="14" />
    <line x1="400" y1="370" x2="400" y2="840" stroke="#475569" stroke-width="3" stroke-dasharray="4 4" />
    <!-- Bottom Hem Trim -->
    <line x1="235" y1="840" x2="565" y2="840" stroke="#0f172a" stroke-width="12" stroke-linecap="square" />
    <!-- Armhole Trims -->
    <path d="M 170 255 L 210 440 L 250 435" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <path d="M 630 255 L 590 440 L 550 435" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />

    <!-- 3M Scotchlite Retroreflective Tape Bands (Horizontal) -->
    <!-- Lower Horizontal Band -->
    <rect x="238" y="700" width="155" height="52" fill="url(#reflective3M)" stroke="#94a3b8" stroke-width="2" />
    <rect x="407" y="700" width="155" height="52" fill="url(#reflective3M)" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Mid Horizontal Band -->
    <rect x="242" y="580" width="151" height="52" fill="url(#reflective3M)" stroke="#94a3b8" stroke-width="2" />
    <rect x="407" y="580" width="151" height="52" fill="url(#reflective3M)" stroke="#94a3b8" stroke-width="2" />

    <!-- Vertical Shoulder Reflective Bands (Left & Right) -->
    <polygon points="275,200 325,210 325,580 275,580" fill="url(#reflective3M)" stroke="#94a3b8" stroke-width="2" />
    <polygon points="525,200 475,210 475,580 525,580" fill="url(#reflective3M)" stroke="#94a3b8" stroke-width="2" />

    <!-- Transparent ID Card Pocket (Right Chest) -->
    <rect x="430" y="420" width="90" height="120" rx="6" fill="#ffffff" fill-opacity="0.25" stroke="#0f172a" stroke-width="3" />
    <rect x="442" y="435" width="66" height="45" rx="3" fill="#0f172a" fill-opacity="0.2" />
    <line x1="442" y1="495" x2="508" y2="495" stroke="#0f172a" stroke-width="3" />
    <line x1="442" y1="510" x2="490" y2="510" stroke="#0f172a" stroke-width="3" />
    <text x="475" y="462" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">FLEET ID</text>

    <!-- GSB Official Brand Crest Badge (Left Chest) -->
    <g transform="translate(265, 420)">
      <!-- Badge Backdrop -->
      <rect width="115" height="85" rx="8" fill="#0f172a" stroke="#f8fafc" stroke-width="2" />
      <rect x="5" y="5" width="105" height="75" rx="6" fill="url(#gsbRed)" />
      
      <!-- GSB Typography -->
      <text x="57" y="38" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="1" text-anchor="middle">GSB</text>
      <text x="57" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.5" text-anchor="middle">GAL SPORTS BETTING</text>
      <rect x="18" y="58" width="80" height="14" rx="3" fill="#0f172a" />
      <text x="58" y="69" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1" text-anchor="middle">FLEET &amp; LOGISTICS</text>
    </g>

    <!-- Heavy-Duty Radio / Mic Clip Loops on Shoulder -->
    <rect x="290" y="270" width="30" height="12" rx="3" fill="#0f172a" />
    <rect x="480" y="270" width="30" height="12" rx="3" fill="#0f172a" />

    <!-- Authentic High-Vis Micro-Prism Grid Texture Detail on Reflective Tape -->
    <line x1="242" y1="606" x2="393" y2="606" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="407" y1="606" x2="558" y2="606" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="238" y1="726" x2="393" y2="726" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="407" y1="726" x2="562" y2="726" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  </g>

  <!-- Production Data Callout Card Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: GSB HIGH-VISIBILITY REFLECTIVE SAFETY VESTS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Gals Sports Betting Logistics • Technique: Thermal Transfer on High-Vis Mesh &amp; 3M Tape Bonding</text>
    <text x="24" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: 120 GSM Fluorescent Polyester Mesh • Retroreflective Micro-Prisms • 450 Units Delivered</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
