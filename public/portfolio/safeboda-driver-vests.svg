<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="safeBodaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7900" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="reflectiveBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="vestShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#ff7900" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • HIGH-VIS SAFETY REFLECTOR PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: SAFEBODA-2500U</text>
  </g>

  <!-- Clothes Hanger -->
  <g id="hanger" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 400 130 C 400 95 435 80 435 55 C 435 35 418 22 398 22 C 378 22 365 37 368 56" stroke-width="9" />
    <path d="M 400 130 L 190 205 C 175 210 180 220 195 218 L 605 218 C 620 220 625 210 610 205 Z" fill="#334155" />
  </g>

  <!-- SafeBoda Driver High-Vis Vest Silhouette -->
  <g filter="url(#vestShadow)">
    <path d="M 270 195 
             L 340 215 
             C 380 235 420 235 460 215 
             L 530 195 
             L 630 255 
             L 590 440 
             L 550 435 
             L 565 840 
             L 235 840 
             L 250 435 
             L 210 440 
             L 170 255 
             Z" 
          fill="url(#safeBodaOrange)" 
          stroke="#0f172a" 
          stroke-width="3" />

    <!-- Dark Navy Trim -->
    <path d="M 270 195 L 340 215 C 380 235 420 235 460 215 L 530 195" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <path d="M 340 215 L 400 370 L 460 215" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    <line x1="400" y1="370" x2="400" y2="840" stroke="#0f172a" stroke-width="14" />
    <line x1="235" y1="840" x2="565" y2="840" stroke="#0f172a" stroke-width="12" />

    <!-- 3M Retroreflective Bands -->
    <rect x="238" y="700" width="155" height="52" fill="url(#reflectiveBand)" stroke="#94a3b8" stroke-width="2" />
    <rect x="407" y="700" width="155" height="52" fill="url(#reflectiveBand)" stroke="#94a3b8" stroke-width="2" />
    <rect x="242" y="580" width="151" height="52" fill="url(#reflectiveBand)" stroke="#94a3b8" stroke-width="2" />
    <rect x="407" y="580" width="151" height="52" fill="url(#reflectiveBand)" stroke="#94a3b8" stroke-width="2" />

    <polygon points="275,200 325,210 325,580 275,580" fill="url(#reflectiveBand)" stroke="#94a3b8" stroke-width="2" />
    <polygon points="525,200 475,210 475,580 525,580" fill="url(#reflectiveBand)" stroke="#94a3b8" stroke-width="2" />

    <!-- SafeBoda Logo & Helmet Graphic (Left Chest) -->
    <g transform="translate(265, 410)">
      <rect width="115" height="90" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <circle cx="57" cy="38" r="24" fill="#ff7900" />
      <path d="M 45 42 C 45 28 69 28 69 42 Z" fill="#ffffff" />
      <text x="57" y="70" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5" text-anchor="middle">SafeBoda</text>
      <text x="57" y="82" fill="#ff7900" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">OFFICIAL DRIVER</text>
    </g>

    <!-- Driver Serial Number Identification (Right Chest) -->
    <g transform="translate(425, 410)">
      <rect width="115" height="90" rx="8" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
      <text x="57" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">HELMET ID</text>
      <text x="57" y="58" fill="#ff7900" font-family="Courier, monospace" font-size="22" font-weight="900" text-anchor="middle">#8942</text>
      <text x="57" y="78" fill="#22c55e" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">KAMPALA METRO</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: SAFEBODA HIGH-VISIBILITY REFLECTIVE RIDER VESTS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: SafeBoda Uganda Logistics • Technique: High-Tensile DTF Transfer &amp; 3M Retroreflective Tape Bonding</text>
    <text x="24" y="68" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Fluorescent Orange Polyester Mesh, Micro-Prismatic Reflective Tape • 2,500 Units</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
