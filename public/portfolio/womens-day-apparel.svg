<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="40%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="apparelShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <!-- Production Specs Header -->
  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#a855f7" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • COMMEMORATIVE APPAREL PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: W-DAY-1000U</text>
  </g>

  <!-- Clothes Hanger -->
  <g id="hanger" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 400 130 C 400 95 435 80 435 55 C 435 35 418 22 398 22 C 378 22 365 37 368 56" stroke-width="9" />
    <path d="M 400 130 L 190 205 C 175 210 180 220 195 218 L 605 218 C 620 220 625 210 610 205 Z" fill="#334155" />
  </g>

  <!-- Purple Commemorative T-Shirt -->
  <g filter="url(#apparelShadow)">
    <path d="M 310 200 
             C 350 240 450 240 490 200 
             L 630 250 
             L 730 380 
             L 640 450 
             L 590 380 
             L 600 840 
             L 200 840 
             L 210 380 
             L 160 450 
             L 70 380 
             L 170 250 
             Z" 
          fill="url(#purpleGradient)" 
          stroke="#4c1d95" 
          stroke-width="2" />

    <!-- Gold Collar Accent -->
    <path d="M 310 200 C 350 245 450 245 490 200 C 460 215 340 215 310 200 Z" fill="#4c1d95" />
    <path d="M 320 200 C 355 235 445 235 480 200" fill="none" stroke="#fbbf24" stroke-width="3" />

    <!-- Chest Artwork (Women's Day Commemorative Design) -->
    <g transform="translate(240, 310)">
      <rect width="320" height="230" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#fbbf24" stroke-width="3" />
      
      <!-- Central Female Profile / Ribbon Silhouette -->
      <circle cx="160" cy="65" r="36" fill="#fbbf24" />
      <path d="M 148 55 C 155 45 165 45 172 55 C 165 75 155 75 148 55 Z" fill="#581c87" />

      <text x="160" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="1" text-anchor="middle">INTERNATIONAL</text>
      <text x="160" y="158" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="2" text-anchor="middle">WOMEN'S DAY</text>
      
      <rect x="30" y="172" width="260" height="28" rx="6" fill="#fbbf24" />
      <text x="160" y="191" fill="#4c1d95" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle">INSPIRE INCLUSION • UGANDA 2024</text>
      <text x="160" y="218" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DIRECT-TO-FILM (DTF) VIBRANT CURE</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: WOMEN'S DAY COMMEMORATIVE APPAREL</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: National Women's Day Initiative • Technique: Direct-to-Film (DTF) Full-Color Transfer &amp; Pneumatic Press</text>
    <text x="24" y="68" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: 100% Ring-Spun Cotton, DTF Pigment Transfer • 1,000 Commemorative Shirts</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
