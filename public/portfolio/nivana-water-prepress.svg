<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="waterBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="labelShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#0284c7" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • ROTARY SCREEN LABEL PREPRESS PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: NIVANA-PREPRESS-50K</text>
  </g>

  <!-- Prepress Film & Bottle Label Cylinder Display -->
  <g filter="url(#labelShadow)" transform="translate(80, 140)">
    <!-- Master Prepress Proof Sheet -->
    <rect width="640" height="700" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Registration Marks -->
    <g transform="translate(20, 20)">
      <circle cx="15" cy="15" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="5" y1="15" x2="25" y2="15" stroke="#38bdf8" />
      <line x1="15" y1="5" x2="15" y2="25" stroke="#38bdf8" />
    </g>
    <g transform="translate(590, 20)">
      <circle cx="15" cy="15" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="5" y1="15" x2="25" y2="15" stroke="#38bdf8" />
      <line x1="15" y1="5" x2="15" y2="25" stroke="#38bdf8" />
    </g>

    <!-- CMYK Color Control Bars -->
    <g transform="translate(80, 25)">
      <rect x="0" y="0" width="30" height="15" fill="#00ffff" />
      <rect x="35" y="0" width="30" height="15" fill="#ff00ff" />
      <rect x="70" y="0" width="30" height="15" fill="#ffff00" />
      <rect x="105" y="0" width="30" height="15" fill="#000000" />
      <rect x="140" y="0" width="30" height="15" fill="#0284c7" />
      <text x="185" y="12" fill="#94a3b8" font-family="Courier, monospace" font-size="10">DENSITY CALIBRATION PASS</text>
    </g>

    <!-- Full Wrap-Around Water Bottle Label -->
    <g transform="translate(40, 70)">
      <rect width="560" height="280" rx="8" fill="url(#waterBlue)" stroke="#38bdf8" stroke-width="3" />
      
      <!-- Flowing Mountain Water Wave Curves -->
      <path d="M 0 180 C 150 140 250 220 400 160 C 480 120 520 180 560 160 L 560 280 L 0 280 Z" fill="#0369a1" opacity="0.6" />
      <path d="M 0 220 C 120 190 280 250 420 200 C 500 170 530 220 560 210 L 560 280 L 0 280 Z" fill="#0284c7" opacity="0.5" />

      <!-- Center Logo & Branding -->
      <g transform="translate(280, 90)">
        <ellipse cx="0" cy="0" rx="20" ry="32" fill="#38bdf8" />
        <path d="M -12 -10 C -12 -25 0 -38 0 -38 C 0 -38 12 -25 12 -10 C 12 5 -12 5 -12 -10 Z" fill="#ffffff" />
        <text x="0" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="4" text-anchor="middle">nivana</text>
        <text x="0" y="65" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">NATURAL MINERAL WATER</text>
        <rect x="-80" y="78" width="160" height="20" rx="4" fill="#ffffff" />
        <text x="0" y="92" fill="#0369a1" font-family="system-ui, sans-serif" font-size="10" font-weight="900" letter-spacing="1" text-anchor="middle">PURE NATURAL SOURCE • 500ML</text>
      </g>

      <!-- Nutritional & Barcode Left Flank -->
      <g transform="translate(30, 60)">
        <text x="0" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">MINERAL ANALYSIS</text>
        <text x="0" y="40" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10">Calcium (Ca): 24 mg/L</text>
        <text x="0" y="55" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10">Magnesium (Mg): 12 mg/L</text>
        <text x="0" y="70" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10">Potassium (K): 4 mg/L</text>
        <text x="0" y="85" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10">pH Balanced: 7.4</text>
      </g>

      <!-- Right Flank Regulatory Marks -->
      <g transform="translate(460, 60)">
        <rect width="70" height="70" rx="6" fill="#ffffff" />
        <text x="35" y="32" fill="#0369a1" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">UNBS</text>
        <text x="35" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">CERTIFIED</text>
        <rect x="10" y="54" width="50" height="10" fill="#22c55e" />
        <text x="35" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7" font-weight="800" text-anchor="middle">QUALITY</text>
      </g>
    </g>

    <!-- Finished Bottle 3D Mockup Profile (Lower Section) -->
    <g transform="translate(200, 390)">
      <!-- 500ml Contoured Bottle Silhouette -->
      <path d="M 90 20 L 150 20 L 150 50 L 170 90 L 170 260 L 70 260 L 70 90 L 90 50 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
      <!-- Bottle Blue Cap -->
      <rect x="95" y="5" width="50" height="18" rx="3" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      <!-- Wrapped Label on Bottle -->
      <rect x="70" y="110" width="100" height="90" fill="url(#waterBlue)" stroke="#38bdf8" stroke-width="1" />
      <text x="120" y="155" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="1" text-anchor="middle">nivana</text>
      <text x="120" y="172" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="7" font-weight="700" text-anchor="middle">500ml Mineral</text>

      <g transform="translate(200, 50)">
        <text x="0" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">CYLINDRICAL ROTARY PREPRESS</text>
        <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Color Space: Pantone Process Blue C + Spot Cyan + White Opaque Underbase</text>
        <text x="0" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Screen Mesh: 380 Thread Count High-Tension Polyester</text>
        <text x="0" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Trapping: 0.15mm Color Overlap for High-Speed Rotary Bottle Press</text>
        <rect x="0" y="130" width="220" height="32" rx="6" fill="#0284c7" />
        <text x="110" y="151" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">50,000 RUN PREPRESS READY</text>
      </g>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: NIVANA WATER ROTARY SCREEN LABELS &amp; PREPRESS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Nivana Beverage Industries • Technique: Rotary Screen Film Output, Color Trapping &amp; Vector Prepress</text>
    <text x="24" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: UV Screen Inks, Waterproof BOPP Clear Synthetic Film • 50,000 Bottle Sleeve Run</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
