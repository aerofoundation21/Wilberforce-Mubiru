<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="tshirtRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shirtShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="#0f172a" />
  <circle cx="400" cy="420" r="350" fill="#1e293b" opacity="0.4" filter="blur(40px)" />

  <!-- Production Specs Header -->
  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#ef4444" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • PROMOTIONAL APPAREL PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: GSB-TSHIRT-1500U</text>
  </g>

  <!-- Clothes Hanger -->
  <g id="hanger" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 400 130 C 400 95 435 80 435 55 C 435 35 418 22 398 22 C 378 22 365 37 368 56" stroke-width="9" />
    <path d="M 400 130 L 190 205 C 175 210 180 220 195 218 L 605 218 C 620 220 625 210 610 205 Z" fill="#334155" />
  </g>

  <!-- T-Shirt Body -->
  <g filter="url(#shirtShadow)">
    <path d="M 310 200 
             C 350 240 450 240 490 200 
             L 630 250 
             L 730 380 
             L 640 450 
             L 590 380 
             L 600 840 
             L 200 840 
             L 210 380 
             L 160 450 
             L 70 380 
             L 170 250 
             Z" 
          fill="url(#tshirtRed)" 
          stroke="#7f1d1d" 
          stroke-width="2" />

    <!-- Ribbed Collar -->
    <path d="M 310 200 C 350 245 450 245 490 200 C 460 215 340 215 310 200 Z" fill="#7f1d1d" />
    <path d="M 320 200 C 355 235 445 235 480 200" fill="none" stroke="#facc15" stroke-width="3" />

    <!-- Sleeve Cuffs -->
    <line x1="70" y1="380" x2="160" y2="450" stroke="#7f1d1d" stroke-width="6" />
    <line x1="730" y1="380" x2="640" y2="450" stroke="#7f1d1d" stroke-width="6" />

    <!-- Left Sleeve Sponsor Patch -->
    <g transform="translate(110, 360) rotate(-40)">
      <rect width="60" height="24" rx="4" fill="#0f172a" />
      <text x="30" y="16" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">UGANDA</text>
    </g>

    <!-- Chest GSB Brand Artwork (Direct-to-Film Print) -->
    <g transform="translate(240, 330)">
      <!-- GSB Shield Background -->
      <rect width="320" height="200" rx="16" fill="#0f172a" stroke="#facc15" stroke-width="4" />
      
      <!-- Primary Logo Header -->
      <circle cx="160" cy="55" r="28" fill="#ef4444" />
      <text x="160" y="66" fill="#facc15" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">GSB</text>
      
      <text x="160" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="2" text-anchor="middle">GAL SPORTS BETTING</text>
      <rect x="40" y="126" width="240" height="28" rx="6" fill="#facc15" />
      <text x="160" y="145" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5" text-anchor="middle">BET WITH THE BEST</text>

      <text x="160" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">HIGH-TENSILE DTF HEAT TRANSFER</text>
    </g>

    <!-- Lower Hem Stitching -->
    <line x1="200" y1="820" x2="600" y2="820" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: GSB BRANDED PROMOTIONAL T-SHIRTS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Gals Sports Betting (GSB) • Technique: Precision DTF Heat Press &amp; Bulk Textile Packaging</text>
    <text x="24" y="68" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: 180 GSM Bio-Washed Combed Cotton • Wash-Fast Polymer Transfer • 1,500 Units</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
