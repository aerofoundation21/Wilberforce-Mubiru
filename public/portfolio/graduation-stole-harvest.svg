<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <!-- Satin Fabric Shading Gradient -->
    <linearGradient id="stoleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8830f" />
      <stop offset="20%" stop-color="#d99f18" />
      <stop offset="50%" stop-color="#f2b827" />
      <stop offset="80%" stop-color="#d99f18" />
      <stop offset="100%" stop-color="#b07d0d" />
    </linearGradient>
    <filter id="fabricShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1200" fill="#f8f9fa" />

  <!-- Clothes Hanger -->
  <g id="hanger" stroke="#4a4d52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hook -->
    <path d="M 400 160 C 400 120 440 100 440 70 C 440 45 420 30 395 30 C 370 30 355 48 358 72" stroke-width="9" />
    <!-- Triangular body -->
    <path d="M 400 160 L 150 250 C 130 258 135 270 155 268 L 645 268 C 665 270 670 258 650 250 Z" fill="#3a3d42" />
    <!-- Horizontal Cross Bar -->
    <line x1="280" y1="210" x2="520" y2="210" stroke="#25272a" stroke-width="12" />
  </g>

  <!-- Golden Graduation Stole / Sash with Drop Shadow -->
  <g filter="url(#fabricShadow)">
    <!-- Left Ribbon Panel -->
    <path d="M 230 140 
             L 400 300 
             L 400 170 
             L 280 140 
             L 190 260 
             L 190 840 
             L 320 940 
             L 445 840
             L 445 460
             Z" 
          fill="none" />

    <!-- Unified Symmetrical Stole Path matching original WA_1790050331440.jpeg -->
    <!-- Neck Drape & Left/Right Stole Ribbons -->
    <path d="M 330 140 
             C 370 165 430 165 470 140 
             L 535 210
             L 550 860 
             L 460 940 
             L 370 860
             L 370 320
             L 430 320
             L 400 350
             L 370 320
             Z" 
          fill="none" />

    <!-- Left Hanging Stole (Front) -->
    <path d="M 190 240 
             L 320 145 
             L 400 240 
             L 400 320 
             L 330 250 
             L 330 850 
             L 260 930 
             L 190 850 
             Z" 
          fill="url(#stoleGold)" stroke="#9c6d09" stroke-width="2" />

    <!-- Right Hanging Stole (Front) -->
    <path d="M 610 240 
             L 480 145 
             L 400 240 
             L 400 320 
             L 470 250 
             L 470 850 
             L 540 930 
             L 610 850 
             Z" 
          fill="url(#stoleGold)" stroke="#9c6d09" stroke-width="2" />

    <!-- Top V-Neck Joining Collar -->
    <path d="M 320 145 
             L 400 220 
             L 480 145 
             L 420 120 
             L 400 130 
             L 380 120 
             Z" 
          fill="#b8830f" />
  </g>

  <!-- Left Stole Screen / Heat Transfer Graphics -->
  <g text-anchor="middle" font-family="'Arial Black', Impact, sans-serif">
    <!-- S&J Header -->
    <text x="260" y="660" font-size="44" font-weight="900" fill="#111111" letter-spacing="1">S&amp;J</text>
    
    <!-- KINDERGARTEN -->
    <text x="260" y="692" font-size="16" font-weight="900" fill="#111111" letter-spacing="3">KINDERGARTEN</text>

    <!-- Harvest International School Emblem (Left) -->
    <g transform="translate(260, 740)">
      <!-- Circle wreath / crest background -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#111111" stroke-width="3.5" />
      <!-- Sprouting leaves emblem -->
      <path d="M 0 14 C 0 0 -16 0 -14 -12 C -4 -10 2 -2 0 14 Z" fill="#111111" />
      <path d="M 0 14 C 0 0 16 0 14 -12 C 4 -10 -2 -2 0 14 Z" fill="#111111" />
      <circle cx="0" cy="-3" r="3.5" fill="#111111" />
      
      <!-- Text beside/under crest -->
      <text x="0" y="38" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#111111">Harvest</text>
      <text x="0" y="49" font-size="8.5" font-family="Arial, sans-serif" font-weight="normal" fill="#222222">international School</text>
    </g>

    <!-- CLASS OF -->
    <text x="260" y="828" font-size="17" font-weight="900" fill="#111111" letter-spacing="2">CLASS OF</text>
    <!-- 2024 -->
    <text x="260" y="872" font-size="44" font-weight="900" fill="#111111" letter-spacing="2">2024</text>
  </g>

  <!-- Right Stole Screen / Heat Transfer Graphics -->
  <g text-anchor="middle" font-family="'Arial Black', Impact, sans-serif">
    <!-- Harvest International School Emblem (Right) -->
    <g transform="translate(540, 740)">
      <!-- Circle wreath / crest background -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#111111" stroke-width="3.5" />
      <!-- Sprouting leaves emblem -->
      <path d="M 0 14 C 0 0 -16 0 -14 -12 C -4 -10 2 -2 0 14 Z" fill="#111111" />
      <path d="M 0 14 C 0 0 16 0 14 -12 C 4 -10 -2 -2 0 14 Z" fill="#111111" />
      <circle cx="0" cy="-3" r="3.5" fill="#111111" />
      
      <!-- Text beside/under crest -->
      <text x="0" y="38" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#111111">Harvest</text>
      <text x="0" y="49" font-size="8.5" font-family="Arial, sans-serif" font-weight="normal" fill="#222222">international School</text>
    </g>

    <!-- CLASS OF -->
    <text x="540" y="828" font-size="17" font-weight="900" fill="#111111" letter-spacing="2">CLASS OF</text>
    <!-- 2024 -->
    <text x="540" y="872" font-size="44" font-weight="900" fill="#111111" letter-spacing="2">2024</text>
  </g>

  <!-- Subtitle Badge Footer -->
  <g transform="translate(400, 1080)" text-anchor="middle">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" />
    <text y="-5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" letter-spacing="1">ROGUE VENTURES • KAMPALA</text>
    <text y="16" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#c99718">S&amp;J Kindergarten Harvest International School Class of 2024</text>
  </g>
</svg>
