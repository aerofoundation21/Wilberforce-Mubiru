<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="kraftPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="50%" stop-color="#bc8a5f" />
      <stop offset="100%" stop-color="#a47148" />
    </linearGradient>
    <filter id="bagShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050a12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#0f172a" />

  <g transform="translate(60, 40)">
    <rect width="680" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#d4a373" />
    <text x="46" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROGUE VENTURES • ECO RETAIL PACKAGING PROOF</text>
    <text x="660" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">BATCH: KRAFT-5000U</text>
  </g>

  <!-- Kraft Shopping Bag Mockup -->
  <g filter="url(#bagShadow)" transform="translate(180, 180)">
    <!-- Twisted Paper Handles -->
    <path d="M 140 100 C 140 -20 300 -20 300 100" fill="none" stroke="#6f4e37" stroke-width="14" stroke-linecap="round" />
    <path d="M 140 100 C 140 0 300 0 300 100" fill="none" stroke="#523927" stroke-width="8" stroke-linecap="round" />

    <!-- Bag Main Body -->
    <polygon points="40,100 400,100 440,650 0,650" fill="url(#kraftPaper)" stroke="#6f4e37" stroke-width="2" />
    <!-- Fold Crease Detail -->
    <polygon points="0,650 40,580 400,580 440,650" fill="#8b5e3c" opacity="0.4" />
    <line x1="220" y1="100" x2="220" y2="580" stroke="#8b5e3c" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Screen-Printed Brand Identity on Bag -->
    <g transform="translate(120, 240)">
      <rect width="200" height="200" rx="12" fill="#2d1e17" stroke="#ffffff" stroke-width="3" />
      <circle cx="100" cy="70" r="40" fill="#d4a373" />
      <text x="100" y="82" fill="#2d1e17" font-family="system-ui, sans-serif" font-size="32" font-weight="900" text-anchor="middle">R</text>

      <text x="100" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2" text-anchor="middle">RETAIL CO.</text>
      <text x="100" y="155" fill="#d4a373" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">KAMPALA • EAST AFRICA</text>
      <line x1="40" y1="168" x2="160" y2="168" stroke="#d4a373" stroke-width="1.5" />
      <text x="100" y="185" fill="#a47148" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">100% RECYCLABLE KRAFT</text>
    </g>
  </g>

  <!-- Production Specs Footer -->
  <g transform="translate(60, 880)">
    <rect width="680" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PROJECT: BRANDED RETAIL PACKAGING BAGS</text>
    <text x="24" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Client: Commercial Retail Brands Uganda • Technique: Precision Screen Printing on Kraft &amp; Non-Woven</text>
    <text x="24" y="68" fill="#d4a373" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material: Biodegradable Kraft Paper &amp; 80 GSM Non-Woven Polypropylene • 5,000 Bags Delivered</text>
    <rect x="530" y="20" width="130" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="595" y="47" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED PROOF</text>
  </g>
</svg>
